<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical</title>
    <link rel ="stylesheet" href="css/images.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>Festival Trails</h1>
            <p>"A vibrant journey through the soul of India — where every festival is a story, every color a celebration."</p>
            <div class="image-grid">
            <div class="image-box">
            <img src ="images/festivals/diwali.jpg" alt="Diwali" class="image">
            <div class="overlay-text">Diwali</div>
            </div>
            <div class="image-box">
            <img src ="images/festivals/baisakhi.jpg" alt="baisakhi" class="image">
            <div class="overlay-text">Baisakhi</div>
            </div>
            <div class="image-box">
            <img src ="images/festivals/Ganesha Chaturthi.jpg" alt="Ganesha chaturthi" class="image">
            <div class="overlay-text">Ganesha Chaturthi</div>
            </div>
            <div class="image-box">
            <img src ="images/festivals/holi.jpg" alt="Holi" class="image">
            <div class="overlay-text">Holi</div>
            </div>
            <div class="image-box">
            <img src ="images/festivals/janmashtami.jpg" alt="janmashtami" class="image">
            <div class="overlay-text">Jamashtami</div>
            </div>
            <div class="image-box">
            <img src ="images/festivals/makar sankarnti.jpg" alt="makar sankranti" class="image">
            <div class="overlay-text">Makar Sankranti</div>
            </div>
            <div class="image-box">
            <img src ="images/festivals/Navratri.jpg" alt="Navratri" class="image">
            <div class="overlay-text">Navratri
            </div>
            </div>
            <div class="image-box">
            <img src ="images/festivals/onam.jpg" alt="Onam" class="image">
            <div class="overlay-text">Onam</div>
            </div>
            <div class="image-box">
            <img src ="images/festivals/Raksha bandhan.jpg" alt="raksha bandhan" class="image">
            <div class="overlay-text">Raksha Bandhan</div>
            </div>
            </div>
            <div class="navigation-buttons">
                <button id="backBtn">⬅️ Back</button>
                <button id="nextBtn">Next ➡️</button>
              </div>
    </div>
    <script src="js/image.js"></script>
</body>
</html>
