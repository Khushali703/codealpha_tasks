<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical</title>
    <link rel ="stylesheet" href="css/images.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>Legecy of Landmarks</h1>
            <p>"Explore the grandeur of ancient marvels that shaped our history."</p>
            <div class="image-grid">
            <div class="image-box">
            <img src ="images/historical/amer fort.jpg" alt="amer fort" class="image">
            <div class="overlay-text">Amer Fort</div>
            </div>
            <div class="image-box">
            <img src ="images/historical/hampi tempels.jpg" alt="hampi temples" class="image">
            <div class="overlay-text">Hampi Temples</div>
            </div>
            <div class="image-box">
            <img src ="images/historical/qutub minar.jpg" alt="qutub minar" class="image">
            <div class="overlay-text">Qutub Minar</div>
            </div>
            <div class="image-box">
            <img src ="images/historical/Sun Temple, Konark.jpg" alt="sun temple" class="image">
            <div class="overlay-text">Sun Temple</div>
            </div>
            <div class="image-box">
            <img src ="images/historical/tajmahal.jpg" alt="tajmahal" class="image">
            <div class="overlay-text">Taj Mahal</div>
            </div>
            <div class="image-box">
            <img src ="images/historical/hawa mahal.jpg" alt="hawa mahal" class="image">
            <div class="overlay-text">Hawa Mahal</div>
            </div>
            <div class="image-box">
            <img src ="images/historical/vijay vilas.jpg" alt="vijay vilas palace" class="image">
            <div class="overlay-text">Vijay Vilas Palace 
            </div>
            </div>
            <div class="image-box">
            <img src ="images/historical/white desert.jpg" alt="white desert" class="image">
            <div class="overlay-text">White Desert</div>
            </div>
            <div class="image-box">
            <img src ="images/historical/dwarka.jpg" alt="dwarka" class="image">
            <div class="overlay-text">Dwarka</div>
            </div>
            </div>
            <div class="navigation-buttons">
                <button id="backBtn">⬅️ Back</button>
                <button id="nextBtn">Next ➡️</button>
              </div>
    </div>
    <script src="js/image.js"></script>
</body>
</html>
